<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Caja padre con tres cajas hijas">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Parcial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class = "Shadow">
        <div class="container-logo">
            <img src="assets/images.jpg" alt="" >
        </div>
        <div>
             <button id = "btn-load-mode" > Dark mode </button>
        </div>
    </header>

    <section class="main-container">
        <p> Active Teory Team</p>
        <h1>Rick and Morty</h1>
        <span> Television y film / Noninee</span>
    </section>
    <div class="search">
        <input class="shadow" type="text" placeholder="Buscar personaje">
        <button> Buscar</button>


    </div>
    <section id="personajes">
    </section>



    <div>
        <button id="btn-load-more">
            cargar mas personajes 
        </button>

    </div>


</body>
<script>
    let info_pages=null
    function renderLoader(){
        const contenedor = document.getElementById('personajes')
        const loader = document.createElement('div')
        loader.setAttribute('id' , 'loader')
        loader. appendChild(document.createTextNode('cargando...'))
        contenedor.appendChild(loader)
    }

    function hiddenLoader(){
        const contenedor = document.getElementById('personajes')
        const loader = document.getElementById('loader')
        contenedor.removeChild(loader)
        }
    async function obtener_personajes(){
        const url = "https://rickandmortyapi.com/api/character";
        renderLoader()
        const response = await fetch(url) 
            .then(res => res.json())
            .catch(err => console.log(err));
            const personajes= response.results; 
            info_pages = response?.info 
            console.log('variable response', info_pages); 
            const contenedor=document.getElementById('personajes') 
            personajes.forEach((Element)=> {
                const contenedor_personajes = document.createElement('div');
                const img= document.createElement('img');
                img.src= Element.image 
                contenedor_personajes.appendChild(img )
                contenedor.appendChild(contenedor_personajes)

                
            });
            hiddenLoader()

        
    }
    function loadMore(){
        console.log ('load More');
    }
    const btn = document.getElementById('btn-load-more')
    btn.addEventListener('click ', loadMore)
    obtener_personajes();



const darkModeButton = document.getElementById ('btn-load-mode');
function toggleDarkMode () {
     document.body.classList.toggle('dark-mode')
     if (document.body.classList.contains('dark-mode')){
        darkModeButton.textContent ='modo claro'
     } else {
        darkModeButton.textContent ='modo oscuro';
        
     }
}


darkModeButton.addEventListener('click', toggleDarkMode)

</script>

</html>
